<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

{%- include head.html -%}

<body>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a href="{{ '/' | relative_url }}" class="nav__brand">Daniele&nbsp;Frisanco</a>

      <nav class="nav__links" id="navLinks" aria-label="Primary">
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#skills">Skills</a>
        <a href="{{ '/' | relative_url }}#experience">Experience</a>
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} class="is-active"{% endif %}>Blog</a>
        <a href="{{ '/assets/pdf/Daniele_Frisanco_CV.pdf' | relative_url }}" class="nav__cv" target="_blank" rel="noopener noreferrer">CV</a>
      </nav>

      <div class="nav__actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-toggle__sun" aria-hidden="true">☀</span>
          <span class="theme-toggle__moon" aria-hidden="true">☾</span>
        </button>
        <button class="nav__burger" id="navBurger" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">

{{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    </div>
  </footer>

  <script src="{{ '/assets/main.js' | relative_url }}" defer></script>
</body>
</html>
